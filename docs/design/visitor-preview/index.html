<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>ELO 2027 · Ecologies of Attention / Ecologías de la atención</title>
  <link rel="preload" href="./assets/fonts/bricolage-grotesque-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/schibsted-grotesk-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./theme.css?v=3">
  <script defer src="./copy.js?v=3"></script>
  <script defer src="./preview.js?v=3"></script>
</head>
<body>
  <div class="shell" id="site" data-width="desktop">
    <header class="site-header frame">
      <div class="nav-pill">
        <a class="brand" href="#/home">ELO<span>chair</span></a>
        <nav class="site-nav" id="navigation" aria-label="Main navigation / Navegación principal"></nav>
        <fieldset class="language-switch" id="languages"><legend id="language-legend" class="sr-only">Language / Idioma</legend>
          <button type="button" data-language="en" lang="en" aria-label="English / Inglés" aria-pressed="false">EN</button>
          <button type="button" data-language="es" lang="es" aria-label="Spanish / Español" aria-pressed="false">ES</button>
          <button type="button" data-language="both" aria-label="English and Spanish / Inglés y español" aria-pressed="true">EN·ES</button>
        </fieldset>
      </div>
    </header>
    <main id="page"></main>
    <footer class="frame site-footer" id="footer"></footer>
  </div>
  <aside class="preview-tools" aria-label="Design preview settings / Ajustes de la vista previa">
    <button type="button" class="preview-toggle" id="preview-toggle" popovertarget="preview-options" aria-haspopup="dialog" aria-expanded="false" aria-controls="preview-options">Preview options / Opciones de vista previa</button>
    <section class="preview-options" id="preview-options" popover role="dialog" aria-labelledby="preview-title"></section>
  </aside>
  <p class="sr-only" id="language-status" role="status"></p>
</body>
</html>
