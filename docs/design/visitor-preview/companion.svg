<path d="M40 82H960" stroke="#405849"/>
<text x="40" y="131" fill="#c9e59a" font-size="12" font-weight="400" font-family="Arial, sans-serif">ELO 2027 · CALL FOR PROPOSALS</text>
<text x="40" y="230" fill="#eef2ea" font-size="78" font-weight="700" font-family="Arial, sans-serif">Ecologies</text>
<text x="40" y="310" fill="#eef2ea" font-size="78" font-weight="700" font-family="Arial, sans-serif">of Attention</text>
<text x="40" y="356" fill="#f0d98a" font-size="22" font-weight="400" font-family="Arial, sans-serif">Ecologías de la atención</text>
<text x="40" y="411" fill="#eef2ea" font-size="19" font-weight="400" font-family="Arial, sans-serif">A call to writers, artists and researchers: explore how electronic</text>
<text x="40" y="440" fill="#eef2ea" font-size="19" font-weight="400" font-family="Arial, sans-serif">literature can reclaim attention as a poetic, political</text>
<text x="40" y="469" fill="#eef2ea" font-size="19" font-weight="400" font-family="Arial, sans-serif">and ecological practice.</text>
<text x="40" y="516" fill="#cdd8ce" font-size="15" font-weight="400" font-family="Arial, sans-serif">3–6 August 2027 · Barranquilla, Colombia</text>
<text x="40" y="542" fill="#cdd8ce" font-size="15" font-weight="400" font-family="Arial, sans-serif">Universidad del Norte · ELO’s first conference in Latin America</text>
<rect x="40" y="570" width="221" height="50" rx="25" fill="#c9e59a" stroke="none"/>
