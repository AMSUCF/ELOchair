<text x="716" y="286" fill="#eef2ea" font-size="29" font-weight="400" font-family="Arial, sans-serif">read</text>
<text x="837" y="445" fill="#eef2ea" font-size="29" font-weight="400" font-family="Arial, sans-serif">notice</text>
<text x="40" y="744" fill="#17251e" font-size="29" font-weight="700" font-family="Arial, sans-serif">Bring your research. Bring your practice.</text>
<text x="40" y="775" fill="#5b5146" font-size="14" font-weight="400" font-family="Arial, sans-serif">Proposals in English or Spanish.</text>
