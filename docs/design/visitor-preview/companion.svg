<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" role="img" aria-labelledby="title desc"><title id="title">ELO 2027 submission invitation</title><desc id="desc">The conference theme and a concise invitation lead to Start a proposal, the official CFP, and three contribution groups. Reviewer sign-in is visible in the header.</desc>
