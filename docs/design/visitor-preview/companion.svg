<text x="365" y="897" fill="#5b5146" font-size="16" font-weight="400" font-family="Arial, sans-serif">and exhibition works.</text>
<text x="365" y="935" fill="#1d5e57" font-size="14" font-weight="400" font-family="Arial, sans-serif">Explore requirements →</text>
