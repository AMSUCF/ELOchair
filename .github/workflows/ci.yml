name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint, typecheck, unit and property tests
        run: npm run check
      - name: Build the server bundle
        run: npm run build -w @elochair/server
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: End-to-end tests at phone size (with axe accessibility checks)
        run: npm run e2e
