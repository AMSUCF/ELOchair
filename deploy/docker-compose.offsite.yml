# Optional: the uploader, which copies finished database dumps from deploy/backups/ to
# S3-compatible object storage. It only ever adds to the bucket; the pruner that keeps the bucket
# to a fixed rolling set runs on another machine (deploy/offsite-prune/). Setup, the settings
# file and the restore drill are in deploy/backup-offsite.md.
#   cp deploy/offsite-upload/.env.example deploy/offsite-upload/.env    # then edit it
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.offsite.yml up -d backup-offsite
services:
  backup-offsite:
    image: rclone/rclone:1.75.2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup-offsite.sh"]
    # The bucket key, the destination and the encryption password are in a file of their own,
    # which this service alone is given. They must never go in deploy/.env: the app container
    # is given everything in that file, and it is the one that faces the internet. Nothing from
    # deploy/.env comes here either, and this service is on a network of its own, from which the
    # database cannot be reached.
    env_file: offsite-upload/.env
    volumes:
      - ./backup-offsite.sh:/backup-offsite.sh:ro
      # Read-only, and never created here: a missing deploy/backups means no backup has run.
      - type: bind
        source: ./backups
        target: /backups
        read_only: true
        bind:
          create_host_path: false
    networks:
      - offsite
    # Dumps are owner-only files that may belong to another user. Of root's powers the container
    # keeps just the one that reads them; it cannot write to them, and its own disk is read-only.
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/bin/sh", "/backup-offsite.sh", "healthy"]
      interval: 1m
      timeout: 10s
      retries: 1
      start_period: 2m

networks:
  offsite:
